repositories {
    mavenCentral()
}
ext.projectName = "Envoy xDS Testing"
ext.projectDescription = "Test a control plane against a real Envoy: record the xDS conversation and check it, Envoy's stats and its log"
ext.projectArtifactName = "envoy-xds-testing"

apply from: "${rootDir}/build.common.gradle"
apply from: "${rootDir}/publishing.gradle"

// Deliberately independent of envoy-xds-core, so any Java control plane can use it.
dependencies {
    api "com.google.guava:guava:33.7.2-jre"
    api 'com.google.protobuf:protobuf-java:3.25.9'
    api 'io.grpc:grpc-api:1.85.1'
    api 'org.assertj:assertj-core:3.27.7'
    api 'org.testcontainers:testcontainers:2.0.5'
    api 'org.junit.jupiter:junit-jupiter-api:6.1.3' // for the conformance suite
    implementation 'org.awaitility:awaitility:4.3.0'
    implementation 'com.google.protobuf:protobuf-java-util:3.25.9'
    implementation 'org.slf4j:slf4j-api:2.0.20'
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.10.5' // lombok adds @SuppressFBWarnings
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2' // and @Generated
    compileOnly 'com.transferwise.envoy:envoy-api:1.17.0' // Users are expected to provide a compatible envoy api
    compileOnly 'org.projectlombok:lombok:1.18.48' // publishing.gradle delomboks sources for javadoc
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
}
