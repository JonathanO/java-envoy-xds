repositories {
    mavenCentral()
}
ext.projectName = "Envoy xDS Example"
ext.projectDescription = "Envoy xDS Example"
ext.projectArtifactName = "envoy-xds-example"

apply from: "${rootDir}/build.common.gradle"
apply from: "${rootDir}/publishing.gradle"

dependencies {
    api "com.google.guava:guava:33.7.2-jre"
    api 'com.google.protobuf:protobuf-java:4.36.2'
    api 'com.transferwise.envoy:envoy-api:1.17.0'
    api project(':envoy-xds-core')
    implementation 'com.google.errorprone:error_prone_annotations:2.51.0'
    implementation 'io.grpc:grpc-api:1.85.1'
    implementation project(':envoy-xds-snapshot')
    runtimeOnly 'ch.qos.logback:logback-classic:1.6.5'
}
