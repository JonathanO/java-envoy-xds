repositories {
    mavenCentral()
}
ext.projectName = "Envoy xDS Example"
ext.projectDescription = "Envoy xDS Example"
ext.projectArtifactName = "envoy-xds-example"

apply from: "${rootDir}/build.common.gradle"
apply from: "${rootDir}/publishing.gradle"

dependencies {
    implementation "com.google.guava:guava:33.7.2-jre"
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'com.github.spotbugs:spotbugs-annotations:4.10.5'
    implementation 'com.google.protobuf:protobuf-java:3.25.9'
    implementation 'io.grpc:grpc-stub:1.85.0'
    implementation project(':envoy-xds-core')
    implementation 'ch.qos.logback:logback-classic:1.6.5'
    implementation 'ch.qos.logback:logback-core:1.6.5'
    implementation 'com.transferwise.envoy:envoy-api:1.17.0'
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
}
