repositories {
    mavenCentral()
}
ext.projectName = "Envoy xDS Snapshot"
ext.projectDescription = "Snapshot-style config for Envoy xDS, with automatic make-before-break ordering"
ext.projectArtifactName = "envoy-xds-snapshot"

apply from: "${rootDir}/build.common.gradle"
apply from: "${rootDir}/publishing.gradle"
apply plugin: 'org.pastalab.fray.gradle'

// ./gradlew :envoy-xds-snapshot:frayTest explores thread interleavings of the @FrayTest tests on Fray's instrumented
// JDK. It takes minutes, so it isn't part of check: CI runs it as a job of its own.
tasks.matching { it.name == 'frayTest' }.configureEach { // the plugin adds it after evaluation
    // envoy-api 1.17's generated code warns on every load, which is most of the time each interleaving takes.
    systemProperty 'com.google.protobuf.use_unsafe_pre22_gencode', 'true'
}

dependencies {
    api project(':envoy-xds-core')
    // In our public API's signatures
    api 'com.google.protobuf:protobuf-java:4.36.2'
    api "com.google.guava:guava:33.7.2-jre"
    api 'com.google.errorprone:error_prone_annotations:2.51.0'
    compileOnly 'com.transferwise.envoy:envoy-api:1.17.0' // Users are expected to provide a compatible envoy api
    testImplementation 'com.transferwise.envoy:envoy-api:1.17.0'
    testImplementation 'dev.hegel:hegel:0.10.1'
}
