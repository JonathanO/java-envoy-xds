repositories {
    mavenCentral()
}
ext.projectName = "Envoy xDS"
ext.projectDescription = "Envoy xDS"
ext.projectArtifactName = "envoy-xds-core"

apply from: "${rootDir}/build.common.gradle"
apply from: "${rootDir}/publishing.gradle"

pitest {
    mutationThreshold = 74 // 342 of 457 killed. Raise it as survivors are killed; the aim is 100
}

dependencies {
    // In our public API's signatures
    api 'com.google.protobuf:protobuf-java:4.36.2'
    api "com.google.guava:guava:33.7.2-jre"
    api 'io.grpc:grpc-stub:1.85.1'
    api 'com.google.errorprone:error_prone_annotations:2.51.0'
    implementation 'io.grpc:grpc-api:1.85.1'
    implementation 'org.slf4j:slf4j-api:2.0.20'
    compileOnly 'net.woaf.jono.envoy:envoy-api:1.36.0' // Users are expected to provide a compatible envoy api
    testImplementation 'net.woaf.jono.envoy:envoy-api:1.36.0'
    testImplementation 'com.github.spotbugs:spotbugs-annotations:4.10.5'
    testImplementation 'dev.hegel:hegel:0.10.3'
    testImplementation 'ch.qos.logback:logback-classic:1.6.6' // to check what we warn about
    testImplementation 'ch.qos.logback:logback-core:1.6.6'
}

javadoc {
    exclude '**/internal/**' // not API
    options.addBooleanOption('Werror', true) // every public API documented
}
