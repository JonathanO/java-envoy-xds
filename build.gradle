import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask

buildscript {
    repositories {
        mavenCentral()
        mavenLocal()
    }
}

plugins {
    id 'java'
    id 'idea'
    id "com.github.spotbugs" version "6.5.13" apply false
    id "net.ltgt.errorprone" version "5.1.1" apply false
    id 'info.solidsoft.pitest' version '1.19.0' apply false
    id 'io.github.gradle-nexus.publish-plugin' version "2.0.0"
    id 'com.autonomousapps.dependency-analysis' version '3.20.0'
    id 'org.pastalab.fray.gradle' version '0.9.0' apply false
    id 'me.champeau.jmh' version '0.7.3' apply false
}

dependencyAnalysis {
    // JUnit's aggregate artifact is how JUnit says to depend on it.
    structure {
        bundle('junit-jupiter') {
            includeGroup('org.junit.jupiter')
        }
    }
    issues {
        all {
            onUnusedDependencies {
                // build.common.gradle gives every module the same test kit.
                exclude('org.assertj:assertj-core', 'org.mockito:mockito-core', 'org.mockito:mockito-junit-jupiter',
                    'org.junit.jupiter:junit-jupiter')
            }
        }
    }
}

idea.project {
    vcs = 'Git'
    languageLevel = JavaVersion.VERSION_17
    targetBytecodeVersion = JavaVersion.VERSION_17
}

idea.module {
    downloadJavadoc = false
    downloadSources = true
    excludeDirs += file('logs')
    excludeDirs += file('gradle')
    excludeDirs += file('build')
    excludeDirs += file('target')
    excludeDirs += file('.idea')
    excludeDirs += file('.gradle')
    excludeDirs += file('logs2')
}

group = "net.woaf.jono.envoy"

nexusPublishing {
    repositories {
        sonatype {
            username = System.getenv("SONATYPE_USER")
            password = System.getenv("SONATYPE_PASSWORD")
        }
    }
}

subprojects {
    tasks.withType(SpotBugsTask).configureEach {
        effort = Effort.MAX
        maxHeapSize = '1g'
        includeFilter = rootProject.file("spotbugs_include_filter.xml")
        omitVisitors = ['FindReturnRef', 'ThrowingExceptions']

        reports {
            create("xml") {
                required = true
            }
        }
    }
}

// ./gradlew pitest mutation tests the libraries, with each module's own tests. Every mutant must be killed; a method
// that can't be is annotated @DoNotMutate, saying why.
configure([project(':envoy-xds-core'), project(':envoy-xds-snapshot')]) {
    apply plugin: 'info.solidsoft.pitest'

    pluginManager.withPlugin('java') { // pitest's extension comes with the java plugin, from build.common.gradle
        dependencies {
            pitest 'org.pitest:pitest-junit5-plugin:1.2.3'
        }

        pitest {
            pitestVersion = "1.30.1"
            targetClasses = ['net.woaf.jono.envoy.xds*']
            outputFormats = ['XML', 'HTML']
            threads = Runtime.runtime.availableProcessors()
            timestampedReports = false
        }
    }
}
