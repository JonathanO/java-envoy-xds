import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask
import org.eclipse.jgit.api.errors.RefAlreadyExistsException

buildscript {
    repositories {
        mavenCentral()
        mavenLocal()
    }
}

plugins {
    id 'java'
    id 'idea'
    id "com.github.spotbugs" version "6.5.13" apply false
    id "net.ltgt.errorprone" version "5.1.1" apply false
    id 'info.solidsoft.pitest' version '1.19.0' apply false
    id 'org.ajoberstar.grgit' version '5.3.3'
    id 'io.github.gradle-nexus.publish-plugin' version "2.0.0"
}

idea.project {
    vcs = 'Git'
    languageLevel = JavaVersion.VERSION_17
    targetBytecodeVersion = JavaVersion.VERSION_17
}

idea.module {
    downloadJavadoc = false
    downloadSources = true
    excludeDirs += file('logs')
    excludeDirs += file('gradle')
    excludeDirs += file('build')
    excludeDirs += file('target')
    excludeDirs += file('.idea')
    excludeDirs += file('.gradle')
    excludeDirs += file('logs2')
}

task tagRelease {
    doLast {
        try {
            grgit.tag.add {
                name = "v$version"
                message = "Release of ${version}"
            }
            grgit.push(refsOrSpecs: ["v$version"])
        }
        catch (RefAlreadyExistsException ignored) {
            logger.warn("Tag v$version already exists.")
        }
    }
}

group = "net.woaf.jono.envoy"

nexusPublishing {
    repositories {
        sonatype {
            username = System.getenv("SONATYPE_USER")
            password = System.getenv("SONATYPE_PASSWORD")
        }
    }
}

subprojects {
    tasks.withType(SpotBugsTask).configureEach {
        effort = Effort.MAX
        maxHeapSize = '1g'
        includeFilter = rootProject.file("spotbugs_include_filter.xml")
        omitVisitors = ['FindReturnRef', 'ThrowingExceptions']

        reports {
            create("xml") {
                required = true
            }
        }
    }
}
