name: "Build & Publish"

on:
  pull_request: # any base, so stacked PRs are tested too
  push:
    branches:
      - main

jobs:
  build:
    name: "Build & Check"
    runs-on:
      - ubuntu-latest
    permissions:
      contents: read
    env:
      GRADLE_OPTS: "-Djava.security.egd=file:/dev/./urandom -Dorg.gradle.parallel=true -Dorg.gradle.console=plain -Dorg.gradle.logging.stacktrace=all"
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v7
        with:
          submodules: true # spec/, the vectors envoy-xds-spec-tests runs
      - name: "Setup Java"
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: "Assemble jar"
        run: ./gradlew assemble --info --parallel
      - name: "Compile tests"
        run: ./gradlew compileTestJava --info --parallel
      - name: "Run checks"
        run: ./gradlew check -x :envoy-xds-e2e-tests:test # the e2e job runs those
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-build
          path: '**/build/test-results/**/*.xml'
      - name: "Upload reports"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: '**/build/reports/'
      - name: "Test if publishing works"
        run: ./gradlew publishToMavenLocal --info

  e2e:
    name: "E2E (Envoy ${{ matrix.envoy }})"
    runs-on:
      - ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        envoy: ["1.36", "1.37", "1.38", "1.39", "1.40"]
    env:
      GRADLE_OPTS: "-Djava.security.egd=file:/dev/./urandom -Dorg.gradle.parallel=true -Dorg.gradle.console=plain -Dorg.gradle.logging.stacktrace=all"
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v7
      - name: "Setup Java"
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: "Run e2e tests"
        # A job per version, each running four tests at a time (junit-platform.properties), to fit the runner's four
        # vCPUs. ChangesDuringAPushAreMergedTest pins Envoy 1.40, so only that job runs it.
        run: >-
          ./gradlew :envoy-xds-e2e-tests:test -PenvoyVersions=${{ matrix.envoy }}
          ${{ matrix.envoy != '1.40' && '--tests net.woaf.jono.envoy.e2e.conformance.EnvoyXdsConformanceTest' || '' }}
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-envoy-${{ matrix.envoy }}
          path: '**/build/test-results/**/*.xml'
      - name: "Upload reports"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-envoy-${{ matrix.envoy }}
          path: '**/build/reports/'

  pitest:
    name: "Mutation tests (${{ matrix.module }})"
    runs-on:
      - ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [envoy-xds-core, envoy-xds-snapshot]
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v7
      - name: "Setup Java"
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: "Run pitest"
        run: ./gradlew :${{ matrix.module }}:pitest --console=plain
      - name: "Upload pitest report"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest-${{ matrix.module }} # open index.html for the surviving mutants
          path: ${{ matrix.module }}/build/reports/pitest/

  # The required status check: passes only if every job above did, and reports all their tests.
  build-and-test:
    name: "Build & Test"
    needs: [build, e2e, pitest]
    if: always()
    runs-on:
      - ubuntu-latest
    permissions:
      contents: read
      checks: write # action-junit-report
    steps:
      - name: "Checkout repo" # so the report can link failures to source
        uses: actions/checkout@v7
      - name: "Download test results"
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: test-results
      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'test-results/**/*.xml'
          require_tests: true
      - name: "Check every job passed"
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  fray:
    name: "Fray"
    runs-on:
      - ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v7
      - name: "Setup Java"
        id: java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: "Explore thread interleavings"
        env:
          JDK25_HOME: ${{ steps.java.outputs.path }} # Fray instruments this JDK instead of downloading one
        run: ./gradlew :envoy-xds-snapshot:frayTest --console=plain
      - name: "Upload Fray reports"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fray-reports # each failure's fray.log and a recording to replay it
          path: build/fray/fray-report/
