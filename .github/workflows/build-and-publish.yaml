name: "Build & Publish"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: "Build & Test"
    runs-on:
      - ubuntu-latest
    permissions:
      contents: read
      checks: write # action-junit-report
    env:
      GRADLE_OPTS: "-Djava.security.egd=file:/dev/./urandom -Dorg.gradle.parallel=true -Dorg.gradle.console=plain -Dorg.gradle.logging.stacktrace=all"
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v7
      - name: "Setup Java"
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: "Assemble jar"
        run: ./gradlew assemble --info --parallel
      - name: "Compile tests"
        run: ./gradlew compileTestJava --info --parallel
      - name: "Run checks"
        run: ./gradlew check
      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'
          require_tests: true
      - name: "Upload reports"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: '**/build/reports/'
      - name: "Test if publishing works"
        run: ./gradlew publishToMavenLocal --info
