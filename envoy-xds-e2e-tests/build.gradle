repositories {
    mavenCentral()
}
ext.projectName = "Envoy xDS Example E2E Tests"
ext.projectDescription = "Envoy xDS Example E2E Tests"
ext.projectArtifactName = "envoy-xds-e2e-tests"

apply from: "${rootDir}/build.common.gradle"
apply from: "${rootDir}/publishing.gradle"

dependencies {
    implementation "com.google.guava:guava:33.7.2-jre"
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'com.github.spotbugs:spotbugs-annotations:4.10.5'
    implementation 'com.google.protobuf:protobuf-java:3.25.9'
    implementation 'com.google.protobuf:protobuf-java-util:3.25.9'
    implementation 'io.grpc:grpc-stub:1.85.0'
    implementation project(':envoy-xds-core')
    implementation project(':envoy-xds-example')
    implementation project(':envoy-xds-testing')
    implementation 'com.transferwise.envoy:envoy-api:1.17.0'
    implementation 'org.projectlombok:lombok:1.18.48'
    implementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    implementation('org.assertj:assertj-core:3.27.7')
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
    testImplementation 'org.testcontainers:testcontainers:2.0.5'
    testImplementation 'org.awaitility:awaitility:4.3.0'
}
