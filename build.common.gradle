import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

buildscript {
    repositories {
        mavenCentral()
        mavenLocal()
    }
}

apply plugin: "java-library"
apply plugin: "checkstyle"
apply plugin: "idea"
apply plugin: 'net.ltgt.errorprone'
apply plugin: 'com.github.spotbugs'

group = "net.woaf.jono.envoy"

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    testImplementation(platform('org.junit:junit-bom:6.1.3'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testImplementation("org.assertj:assertj-core:3.27.7")
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'com.transferwise.envoy:envoy-api:1.17.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
    testImplementation 'net.jqwik:jqwik:1.10.2'
    spotbugs 'com.github.spotbugs:spotbugs:4.10.5'
    errorprone "com.google.errorprone:error_prone_core:2.50.0"
}

java {
    withSourcesJar()
    withJavadocJar()
}

jar {
    manifest {
        attributes(
                "Implementation-Title": projectName,
                "Implementation-Version": archiveVersion
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    // Error Prone needs JDK 21+ to run; keep the published bytecode at 17.
    options.release = 17
}

compileJava {
    options.encoding = 'utf-8'
    options.compilerArgs << '-parameters'
    options.compilerArgs << '-Xlint'
    options.compilerArgs << '-Xlint:-processing'
}

test {
    useJUnitPlatform() {
        includeEngines("junit-jupiter", "jqwik")
    }
    testLogging {
        events TestLogEvent.STARTED, TestLogEvent.FAILED, TestLogEvent.SKIPPED, TestLogEvent.PASSED,
                TestLogEvent.STANDARD_ERROR
        showExceptions = true
        showStackTraces = true
        exceptionFormat = TestExceptionFormat.FULL
    }
}

tasks.withType(Checkstyle) {
    config = resources.text.fromFile(file('../google_checks.xml'))

    maxWarnings = 0

    reports {
        xml.required = true
        html.required = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone.disableWarningsInGeneratedCode = true
}

clean.doFirst {
    delete "out"
}
