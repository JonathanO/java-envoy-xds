import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

buildscript {
    repositories {
        mavenCentral()
        mavenLocal()
    }
}

apply plugin: "java-library"
apply plugin: "checkstyle"
apply plugin: "idea"
apply plugin: 'net.ltgt.errorprone'
apply plugin: 'com.github.spotbugs'

group = "net.woaf.jono.envoy"

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    testImplementation(platform('org.junit:junit-bom:6.1.3'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testImplementation("org.assertj:assertj-core:3.27.7")
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'com.transferwise.envoy:envoy-api:1.17.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
    spotbugs 'com.github.spotbugs:spotbugs:4.10.5'
    errorprone "com.google.errorprone:error_prone_core:2.51.0"
    errorprone "com.uber.nullaway:nullaway:0.14.3"
    api "org.jspecify:jspecify:1.0.1"
}

java {
    withSourcesJar()
    withJavadocJar()
}

jar {
    manifest {
        attributes(
                "Implementation-Title": projectName,
                "Implementation-Version": archiveVersion
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    // Error Prone needs JDK 21+ to run; keep the published bytecode at 17.
    options.release = 17
}

compileJava {
    options.encoding = 'utf-8'
    options.compilerArgs << '-parameters'
    options.compilerArgs << '-Xlint'
    options.compilerArgs << '-Xlint:-processing'
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED' // Hegel
    testLogging {
        events TestLogEvent.STARTED, TestLogEvent.FAILED, TestLogEvent.SKIPPED, TestLogEvent.PASSED,
                TestLogEvent.STANDARD_ERROR
        showExceptions = true
        showStackTraces = true
        exceptionFormat = TestExceptionFormat.FULL
    }
}

tasks.withType(Checkstyle) {
    config = resources.text.fromFile(file('../google_checks.xml'))

    maxWarnings = 0

    reports {
        xml.required = true
        html.required = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone.disableWarningsInGeneratedCode = true
    options.compilerArgs << '-Werror'
}

compileJava {
    // Every main package is @NullMarked (see its package-info.java), and NullAway checks it strictly.
    options.errorprone {
        error("NullAway")
        option("NullAway:OnlyNullMarked", "true")
        option("NullAway:JSpecifyMode", "true")
        option("NullAway:CheckOptionalEmptiness", "true")
        option("NullAway:AcknowledgeRestrictiveAnnotations", "true")
        // Off by default in Error Prone, but each found something here.
        error("NonFinalStaticField", "RedundantNullCheck", "ThrowSpecificExceptions")
    }
}

compileTestJava {
    // Hegel calls its native engine through the FFM API. Tests aren't published, so needn't run on 17.
    options.release = 22
    // Tests aren't @NullMarked, and often call a method for its side effect alone.
    options.errorprone.disable("NullAway", "CheckReturnValue")
}

clean.doFirst {
    delete "out"
}
