[versions]
envoy-api = "1.36.0" # the oldest Envoy release upstream supports; users bring their own
errorprone = "2.51.0"
grpc = "1.85.1"
guava = "33.7.2-jre"
junit = "6.1.3"
logback = "1.6.6"
mockito = "5.24.0"
pitest = "1.30.1"
protobuf = "4.36.2"
slf4j = "2.0.20"
spotbugs = "4.10.5"

[libraries]
assertj = "org.assertj:assertj-core:3.27.7"
awaitility = "org.awaitility:awaitility:4.3.0"
envoy-api = { module = "net.woaf.jono.envoy:envoy-api", version.ref = "envoy-api" }
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
grpc-api = { module = "io.grpc:grpc-api", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
hamcrest = "org.hamcrest:hamcrest:3.0"
hegel = "dev.hegel:hegel:0.10.4"
jspecify = "org.jspecify:jspecify:1.0.1"
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
nullaway = "com.uber.nullaway:nullaway:0.14.3"
pitest-junit5 = "org.pitest:pitest-junit5-plugin:1.2.3"
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
spotbugs = { module = "com.github.spotbugs:spotbugs", version.ref = "spotbugs" }
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugs" }
testcontainers = "org.testcontainers:testcontainers:2.0.5"

# Gradle plugins the convention plugins in build-logic apply, as build-logic dependencies.
errorprone-plugin = "net.ltgt.gradle:gradle-errorprone-plugin:5.1.1"
pitest-plugin = "info.solidsoft.gradle.pitest:gradle-pitest-plugin:1.19.0"
spotbugs-plugin = "com.github.spotbugs.snom:spotbugs-gradle-plugin:6.5.13"

[plugins]
fray = "org.pastalab.fray.gradle:0.9.0"
jmh = "me.champeau.jmh:0.7.3"
nexus-publish = "io.github.gradle-nexus.publish-plugin:2.0.0"
